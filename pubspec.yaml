name: marley
description: Marley — orçamento familiar (Nando & Thati), estilo YNAB.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/marley_icon.png
  adaptive_icon_background: "#4a2080"
  adaptive_icon_foreground: assets/icon/marley_icon_foreground.png
  remove_alpha_ios: true
